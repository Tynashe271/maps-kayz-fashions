# See DEPLOYMENT.md for the full runbook (VPS setup, CI/CD variables, DNS).
#
# Pipeline:
#   build-backend  -> builds backend/Containerfile, pushes to the GitLab
#                     Container Registry, tagged with the commit SHA and
#                     "latest".
#   deploy-backend -> SSHes into the VPS and runs deploy.sh, which pulls the
#                     new image and restarts the Podman Compose stack.
#   pages          -> builds the customer storefront and publishes it via
#                     GitLab Pages. The admin app is deployed separately (its
#                     own Cloudflare Pages project) rather than crammed into
#                     a subpath here — it's a different Vue Router / Vite
#                     "base" than this one, and keeping it a fully separate
#                     deployment also keeps it on its own access-controlled
#                     domain. See DEPLOYMENT.md for both. Skip this job
#                     entirely if you're putting the storefront on Cloudflare
#                     Pages too.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   SSH_PRIVATE_KEY   - deploy key for the VPS's mapskayz-deploy user (masked)
#   DEPLOY_HOST       - VPS IP or hostname
#   DEPLOY_USER       - e.g. mapskayz-deploy
# CI_REGISTRY / CI_REGISTRY_USER / CI_REGISTRY_PASSWORD / CI_REGISTRY_IMAGE
# are provided automatically by GitLab — no setup needed for those.

stages:
  - build
  - deploy
  - pages

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd backend
    - docker build -f Containerfile -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

deploy-backend:
  stage: deploy
  image: alpine:3.20
  needs: ["build-backend"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "CI_REGISTRY=$CI_REGISTRY CI_REGISTRY_USER=$CI_REGISTRY_USER CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE IMAGE_TAG=$CI_COMMIT_SHORT_SHA /opt/mapskayz/deploy.sh"

pages:
  stage: pages
  image: node:22-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
  variables:
    # Override in Settings > CI/CD > Variables with your real API domain —
    # this default only avoids a broken build if it's not set yet.
    VITE_API_BASE_URL: "https://api.yourdomain.com"
  script:
    - cd frontend && npm ci && npm run build
    - mkdir -p ../public
    - cp -r dist/* ../public/
  artifacts:
    paths:
      - public
