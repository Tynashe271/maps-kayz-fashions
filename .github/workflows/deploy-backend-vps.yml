# DORMANT FOR NOW — the backend deploys to Google Cloud Run instead (see
# deploy-backend-cloudrun.yml) while there's no VPS provisioned. This DigitalOcean
# + Podman path is kept ready to switch back to later: manual-trigger only
# (Actions tab > this workflow > Run workflow) so it doesn't fail on every
# push in the meantime. See DEPLOYMENT.md's "DigitalOcean VPS" section.
#
# build -> builds backend/Containerfile, pushes to the GitHub Container
#          Registry (ghcr.io), tagged with the commit SHA and "latest".
# deploy -> SSHes into the VPS and runs deploy.sh, which pulls the new image
#           and restarts the Podman Compose stack.
#
# Required repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   SSH_PRIVATE_KEY   - deploy key for the VPS's mapskayz-deploy user
#   DEPLOY_HOST       - VPS IP or hostname
#   DEPLOY_USER       - e.g. mapskayz-deploy
# GITHUB_TOKEN is provided automatically — no setup needed for registry auth.

name: Deploy backend (DigitalOcean VPS)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (ghcr.io requires lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}/backend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: backend
        run: |
          docker build -f Containerfile \
            -t "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            -t "${{ steps.image.outputs.name }}:latest" .
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "REGISTRY=ghcr.io REGISTRY_USER=${{ github.actor }} REGISTRY_PASSWORD=$GH_TOKEN REGISTRY_IMAGE=$IMAGE IMAGE_TAG=${{ github.sha }} /opt/mapskayz/deploy.sh"
