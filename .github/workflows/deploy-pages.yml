# Publishes the customer storefront (frontend/) via GitHub Pages. The admin
# app is deployed separately as its own Cloudflare Pages project rather than
# crammed into a subpath here — it's a different Vue Router / Vite "base"
# than this one, and keeping it fully separate also keeps it on its own
# access-controlled domain. See DEPLOYMENT.md for both.
#
# One-time setup: Settings > Pages > Build and deployment > Source =
# "GitHub Actions".
#
# Optional repo variable (Settings > Secrets and variables > Actions >
# Variables) — not a secret, just the backend's public URL:
#   VITE_API_BASE_URL = https://api.yourdomain.com

name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - frontend/**
      - .github/workflows/deploy-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # TEMPORARY (2026-09-13): the custom domain (shop.tinashenyenyesa.co.zw)
          # was pulled from Settings > Pages because WebZim's nameservers
          # (ns1/ns2.webzim.net) were failing to answer queries for it —
          # confirmed by querying them directly, not just a propagation
          # delay. Site is serving from the github.io/<repo>/ subpath in the
          # meantime, so VITE_BASE_PATH is back on. Once WebZim's DNS is
          # healthy again and the custom domain is re-added in Settings >
          # Pages, delete this VITE_BASE_PATH line and this comment — the
          # site goes back to serving from root and this override would
          # otherwise break asset paths again.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - name: SPA fallback for client-side routing
        # GitHub Pages serves 404.html for any path it doesn't recognize as a
        # file. Vue Router uses history mode, so a hard refresh (or a shared
        # link) on e.g. /shop must still resolve to the app shell.
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
