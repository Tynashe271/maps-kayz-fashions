# /etc/nginx/sites-available/mapskayz-api — reverse proxy to the Podman-hosted
# backend on 127.0.0.1:9200. Install, then let Certbot fill in the SSL half:
#
#   sudo cp mapskayz-api.conf /etc/nginx/sites-available/mapskayz-api
#   sudo ln -s /etc/nginx/sites-available/mapskayz-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com
#
# Certbot rewrites this file in place to add the certificate paths, a 443
# server block, and an HTTP->HTTPS redirect on this one — don't hand-edit
# those parts afterwards; renewals (certbot renew, on a systemd timer by
# default) expect to find and update them here.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Matches the 3mb JSON/urlencoded body limit set in backend/src/main.ts.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/sync/events is a long-lived Server-Sent Events stream (see
    # backend/src/sync). Buffering/caching it would delay or truncate events,
    # and the default proxy_read_timeout (60s) would kill the connection
    # between the sync service's 20s heartbeats.
    location /api/sync/events {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
